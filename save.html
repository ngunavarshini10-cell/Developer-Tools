
<!DOCTYPE html>
<html>
<head>
    <title>Diagonal Linear Gradient</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: white;
        }

        h1 {
            color: darkblue;
        }

        .box {
            width: 300px;
            height: 150px;
            margin: 20px auto;
            border-radius: 15px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .box1 {
            background: linear-gradient(to bottom left, red, yellow);
        }

        .box2 {
            background: linear-gradient(to bottom right, blue, pink);
        }

        .box3 {
            background: linear-gradient(to top left, green, orange);
        }

        .box4 {
            background: linear-gradient(to top right, purple, skyblue);
        }

    </style>
</head>

<body>

    <h1>CSS Linear Gradient Directions</h1>

    <div class="box box1">
        Bottom Left
    </div>

    <div class="box box2">
        Bottom Right
    </div>

    <div class="box box3">
        Top Left
    </div>

    <div class="box box4">
        Top Right
    </div>

</body>
</html>
