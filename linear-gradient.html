<!DOCTYPE html>
<html>
    <head>
        <title>Linear-gradient</title>
    <style>
        .box1{
             height:200px;
             background-image:linear-gradient(to bottom,violet,pink);
            }
        .box2{
              height:200px;
              background-image:linear-gradient(to top,purple,yellow);
             }
        .box3{
              height:200px;
              background-image:linear-gradient(to left,black,red);
             }
        .box4{
            height:200px;
            background-image:linear-gradient(to right,grey,green);
            }
        .box5{
            height:200px;
            background-image:linear-gradient(to bottom right,aqua,blue);
            }
        .box6{
            height:200px;
            background-image:linear-gradient(to bottom left,orange,white);
            }
        .box7{
            height:200px;
            background-image:linear-gradient(to top right,lavender,silver);
            }
        .box8{
            height:200px;
            background-image:linear-gradient(to top left,gold,brown);
            }
        .box9{
            height:200px;
            background-image:linear-gradient(180deg,olive green,mint green);
            }
        body{
            text-align:center;
            background-color:bisque;
           }
     </style>
    </head>
    <body>
        <div class="box1">
            <h4>to bottom</h4>
        </div>
        <div class="box2">
            <h4>to top</h4>
        </div>
        <div class="box3">
            <h4>to left</h4>
        </div>
        <div class="box4">
            <h4>to right</h4>
        </div>
        <div class="box5">
            <h4>to bottom right</h4>
        </div>
        <div class="box6">
            <h4>to bottom left</h4>
        </div>
        <div class="box7">
            <h4>to top right</h4>
        </div>
        <div class="box8">
            <h4>to top left</h4>
        </div>
        <div class="box9></div>
    </body>
</html>
