<!DOCTYPE HTML>
<html>
    <head>
        <title>Table and lists</title>
    <style>
         table{
            width:10%;
            border-collapse:collapse;
         }
          td{
            border:2px solid black;
             padding:10px;
             text-align:center;
           }
        .one{
            background-color:aqua;
            font-style:italic;
           }
        .two{
            background-color:blueviolet;
            font-style:cursive;
            }
        .three{
            background-color:red;
            font-style:sans-serif;
             }
        .four{
            background-color:aquamarine;
            font-style:serif;
             }
    </style>
    </head>
    <body>
        <table>
            <tr>
                <td><b>Fruits</b>
                <ol type="1">
                    <li>Apple</li>
                    <li>Banana</li>
                    <li>Dragon fruit</li>
                    <li>Orange</li>
                </ol>
            </tr>
        </td>
            <tr>
                <td><i>Vegetables</i>
                <ul type="circle">
                    <li>Carrot</li>
                    <li>Beetroot</li>
                    <li>capsicum</li>
                    <li>ladies finger</li>
                </ul>
            </tr>
            </td>
            <tr>
                <td><em>junck food</em>
                    <ol type="a">
                    <li>cooldrinks</li>
                    <li>ice creams</li>
                    <li>chocolates</li>
                    <li>chips</li>
                    </ol>
                </tr>
            </td>
        <tr>
            <td><b>biryani's</b></td>
            <ul type="square">
                <li>Chicken biryani</li>
                <li>Mutton biryani</li>
            </ul>
        </tr>
        </table>
        </div>
