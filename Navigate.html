<!DOCTYPE html>
<html>
<head>
    <title>Internal Navigation</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            }

        nav {
            background-color: black;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
            }

        nav a:hover {
                     color: yellow;
                    }

        section {
                 height: 500px;
                 padding: 30px;
                }

        #home {
               background-color: lightblue;
              }

        #about {
                background-color: lightgreen;
               }

        #contact {
                  background-color: lightpink;
                 }

        html {
              scroll-behavior: smooth;
             }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h1>Home</h1>
        <p>Welcome to our website.</p>
    </section>

    <section id="about">
        <h1>About</h1>
        <p>This is the About section.</p>
    </section>

    <section id="contact">
        <h1>Contact</h1>
        <p>Contact us here.</p>
    </section>

</body>
</html>
