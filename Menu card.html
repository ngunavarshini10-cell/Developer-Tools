<!DOCTYPE html>
<html>
<head>
    <title>Items Table</title>
    <style>
        body{
            font-family: Arial, sans-serif;
        }

        h1{
            text-align:center;
            color:darkred;
        }

        .container{
            display:flex;
            justify-content:center;
            align-items:flex-start;
            gap:50px;
        }

        table{
            border-collapse:collapse;
            width:500px;
        }

        table, th, td{
            border:2px solid black;
        }

        th{
            background-color:lightgreen;
            color:darkblue;
            padding:10px;
        }

        td{
            padding:10px;
            vertical-align:top;
        }

        img{
            width:220px;
            height:220px;
            border:3px solid purple;
            border-radius:50%;
        }
    </style>
</head>

<body>

<h1>Items</h1>

<div class="container">

<table>
    <tr>
        <td>
            <b>Vegetables</b>
            <ul>
                <li>Tomato</li>
                <li>Potato</li>
                <li>Carrot</li>
                <li>Onion</li>
            </ul>
        </td>

        <td>
            <b>Fruits</b>
            <ol>
                <li>Apple</li>
                <li>Banana</li>
                <li>Mango</li>
                <li>Orange</li>
            </ol>
        </td>
    </tr>

    <tr>
        <td>
            <b>Sea Food</b>
            <ul>
                <li>Fish</li>
                <li>Prawns</li>
                <li>Crab</li>
                <li>Lobster</li>
            </ul>
        </td>

        <td>
            <b>Bakery Items</b>
            <ol type="i">
                <li>Cake</li>
                <li>Bread</li>
                <li>Cookies</li>
                <li>Donut</li>
            </ol>
        </td>
    </tr>
</table>



</div>

</body>
</html>
