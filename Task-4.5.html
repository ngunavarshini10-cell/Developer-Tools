
<!DOCTYPE html>
<html>
<head>
    <title>Linear Gradient Directions</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: white;
        }

        h1 {
            color: darkblue;
        }

        .box {
            width: 300px;
            height: 150px;
            margin: 20px auto;
            border-radius: 15px;
            color: white;
            font-size: 25px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box1 {
            background: linear-gradient(45deg, red, yellow);
        }

        .box2 {
            background: linear-gradient(90deg,blue,pink);
        }

        .box3 {
            background: linear-gradient(180deg,green,lightgreen);
        }

        .box4 {
            background: linear-gradient(270deg,purple, orange);
        }

    </style>
</head>

<body>

    <h1>CSS Linear Gradient Directions</h1>

    <div class="box box1">
        45 DEG
    </div>

    <div class="box box2">
        90 DEG
    </div>

    <div class="box box3">
        180 DEG
    </div>

    <div class="box box4">
        270 DEG
    </div>

</body>
</html>
